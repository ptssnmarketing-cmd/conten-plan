<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sumber Info — Storypie &amp; Gumik</title>
<!--
  Halaman publik. Dibuka konsumen tanpa login, biasanya dari QR di meja kasir.

  Warna dan huruf sengaja disalin apa adanya dari aplikasi Marketing SSN —
  token yang sama, tema yang sama — supaya halaman ini tidak terasa seperti
  situs lain. Tema yang dipakai ditentukan di menu Sumber Info.

  Pertanyaannya tidak ditulis di berkas ini: dibaca dari pengaturan/survei
  di Firestore. Kalau dokumen itu belum ada, dipakai pertanyaan bawaan yang
  sama persis dengan yang ditampilkan aplikasi, supaya form tetap bisa
  dipakai sejak menit pertama tanpa menunggu siapa pun menyimpan apa pun.

  Yang dikirim balik cuma jawaban. Tidak ada nama, nomor telepon, email,
  cookie, atau pelacak apa pun.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== token warna: sama persis dengan aplikasi ===== */
:root{
  --brand:#17A05B; --brand-deep:#0B5B34; --brand-soft:#E3F4EA; --on-brand:#FFFFFF;
  --bg:#F2F5F3; --paper:#FFFFFF; --surface:#FAFCFB; --surface-2:#EDF2EF; --hover:#F1F6F3;
  --ink:#101828; --ink-2:#475467; --muted:#8A94A6; --line:#E2E8E5; --track:#EAF0EC;
  --ok:#17A05B; --bad:#D63A32;
  --radius:14px; --radius-ctl:9px;
  --shadow:0 1px 2px rgba(16,24,40,.04);
}
[data-theme="biru"]{--brand:#2347CE;--brand-deep:#152C6B;--brand-soft:#E8EDFC;--bg:#F4F6FA;--surface:#FAFBFD;--surface-2:#EEF2F8;--hover:#F2F5FA;--line:#E3E8F0;--track:#EDF1F7;--ok:#12A150}
[data-theme="pink"]{--brand:#BE185D;--brand-deep:#6D0F37;--brand-soft:#FCE7F2;--bg:#FBF4F7;--surface:#FEFAFC;--surface-2:#F7EBF1;--hover:#FAF1F5;--line:#EFDCE5;--track:#F4E6EC}
[data-theme="indigo"]{--brand:#4338CA;--brand-deep:#1E1B58;--brand-soft:#E8E6FB;--bg:#F5F5FB;--surface:#FAFAFE;--surface-2:#EEEDF9;--hover:#F3F2FB;--line:#E4E2F2;--track:#EDECF7}
[data-theme="teal"]{--brand:#0E8C87;--brand-deep:#0A4F4C;--brand-soft:#DCF2F0;--bg:#F2F9F9;--surface:#F9FDFD;--surface-2:#E6F3F2;--hover:#F0F8F8;--line:#D8E9E8;--track:#E4F0EF}
[data-theme="hijau"]{--brand:#12803C;--brand-deep:#0B4A23;--brand-soft:#DDF3E4;--bg:#F3F9F5;--surface:#FAFDFB;--surface-2:#E7F3EB;--hover:#F1F8F3;--line:#DAE9DF;--track:#E6F0E9}
[data-theme="slate"]{--brand:#334155;--brand-deep:#1A2231;--brand-soft:#E6EAF0;--bg:#F5F6F8;--surface:#FAFBFC;--surface-2:#EDEFF3;--hover:#F2F3F6;--line:#E1E4EA;--track:#EBEEF2}
[data-theme="violet"]{--brand:#6E3FD4;--brand-deep:#38206F;--brand-soft:#EDE6FB;--bg:#F7F5FC;--surface:#FCFAFE;--surface-2:#F0EBFA;--hover:#F5F2FC;--line:#E6E0F3;--track:#EDE8F7}
[data-theme="dark"],[data-theme="midnight"]{--ok:#3DD68C;--bad:#F87171}
[data-theme="dark"]{
  --brand:#5B82F5;--brand-deep:#11151F;--brand-soft:#1E2742;--on-brand:#FFFFFF;
  --bg:#0C1017;--paper:#141A24;--surface:#1A212D;--surface-2:#202938;--hover:#1D2531;
  --ink:#E9EEF6;--ink-2:#BCC7D6;--muted:#7D8A9C;--line:#273040;--track:#273040;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
[data-theme="midnight"]{
  --brand:#4C8FD6;--brand-deep:#0A0E16;--brand-soft:#17273A;--on-brand:#FFFFFF;
  --bg:#070A10;--paper:#101620;--surface:#161E2A;--surface-2:#1C2634;--hover:#19212D;
  --ink:#E6EDF6;--ink-2:#B6C4D6;--muted:#76859A;--line:#222D3C;--track:#222D3C;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:28px 16px calc(36px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto}
.kartu{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:24px}
.merek{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.merek .mark{width:34px;height:34px;flex:none;border-radius:10px;background:var(--brand);
  color:var(--on-brand);display:flex;align-items:center;justify-content:center}
.merek .mark svg{width:19px;height:19px;stroke-width:2;fill:none;stroke:currentColor;
  stroke-linecap:round;stroke-linejoin:round}
.merek .t{font-weight:800;font-size:14.5px;letter-spacing:-.3px;line-height:1.2}
.merek .s{font-size:10.5px;color:var(--muted);line-height:1.2}
h1{font-size:21px;line-height:1.3;margin:0 0 8px;letter-spacing:-.4px;font-weight:800}
.sapaan{color:var(--ink-2);margin:0 0 22px;font-size:14.5px}
.soal{margin-bottom:22px}
.soal > label{display:block;font-weight:700;font-size:14.5px;margin-bottom:10px}
.wajib{color:var(--bad);margin-left:2px}
.opsi{display:flex;flex-direction:column;gap:8px}
.opsi label{display:flex;align-items:center;gap:11px;padding:12px 14px;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--radius-ctl);background:var(--surface);
  font-size:14.5px;transition:border-color .12s,background .12s}
.opsi label:hover{background:var(--hover)}
.opsi input{accent-color:var(--brand);width:18px;height:18px;flex:none;margin:0}
.opsi label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);font-weight:600}
input[type=text],textarea,select{width:100%;font:inherit;font-size:14.5px;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-ctl);padding:12px 14px}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
textarea{resize:vertical;min-height:84px;font-family:inherit}
.lain{margin-top:8px}
button{width:100%;font:inherit;font-size:15px;font-weight:700;color:var(--on-brand);
  background:var(--brand);border:none;border-radius:var(--radius-ctl);padding:15px;
  cursor:pointer;min-height:52px}
button:hover{filter:brightness(.95)}
button:disabled{opacity:.6;cursor:default;filter:none}
.galat{color:var(--bad);font-size:13.5px;margin-top:12px}
.kaki{text-align:center;color:var(--muted);font-size:11.5px;margin-top:18px;line-height:1.6}
.pusat{text-align:center;padding:14px 0}
.ceklis{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:var(--brand-soft);
  display:flex;align-items:center;justify-content:center}
.ceklis svg{width:28px;height:28px;stroke:var(--brand);stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){
  .kartu{animation:naik .22s ease}
  @keyframes naik{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap"><div class="kartu" id="isi">
  <p class="pusat" style="color:var(--muted)">Memuat…</p>
</div>
<p class="kaki" id="kaki"></p></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); };

  // Harus sama persis dengan SURVEI_BAWAAN di aplikasi. Kalau dokumen
  // pengaturan belum pernah disimpan, aplikasi menampilkan pertanyaan ini
  // dan halaman publik harus menampilkan yang sama — bukan menyerah.
  var BAWAAN = {
    aktif: true, tema: 'mint',
    judul: 'Terima kasih sudah mampir!',
    sapaan: 'Satu pertanyaan singkat, ya. Jawabanmu membantu kami tahu cara terbaik menyapa pelanggan baru.',
    terimaKasih: 'Terima kasih! Sampai jumpa lagi.',
    outlets: [
      {nama:'Storypie Pekanbaru', aktif:true},
      {nama:'Storypie Medan',     aktif:true},
      {nama:'Gumik Pekanbaru',    aktif:true}
    ],
    pertanyaan: [
      {teks:'Dari mana kamu tahu tentang kami?', tipe:'pilihan', wajib:true,
       opsi:['Instagram','TikTok','Teman atau keluarga','Lewat depan outlet','Google Maps','GoFood / GrabFood','Acara atau bazar','Lainnya']},
      {teks:'Ada masukan buat kami?', tipe:'teks', wajib:false, opsi:[]}
    ]
  };
  var TEMA_SAH = ['mint','biru','pink','indigo','teal','hijau','slate','violet','dark','midnight'];

  function merekHtml(){
    return '<div class="merek"><span class="mark" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24"><path d="M4 18.5 9 12l4 4 7-10"/><path d="M4 21h17"/></svg></span>' +
      '<span><span class="t" style="display:block">Marketing SSN</span>' +
      '<span class="s" style="display:block">Storypie × Gumik</span></span></div>';
  }
  function pesan(judul, teks){
    $('isi').innerHTML = merekHtml() + '<div class="pusat"><h1>' + esc(judul) + '</h1>' +
      '<p class="sapaan" style="margin:0">' + esc(teks) + '</p></div>';
  }
  function pasangTema(t){
    if(t && t !== 'mint' && TEMA_SAH.indexOf(t) >= 0) document.documentElement.setAttribute('data-theme', t);
  }

  if(!window.FIREBASE_CONFIG || String(window.FIREBASE_CONFIG.apiKey||'').indexOf('GANTI_') === 0){
    pesan('Form belum siap', 'Pengaturan aplikasi belum lengkap. Hubungi tim marketing.');
    return;
  }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var db = firebase.firestore();

  // ?o=Nama%20Store  -> store sudah terpilih, konsumen tidak perlu memilih.
  // Dipakai untuk QR yang ditempel di satu store tertentu.
  var outletUrl = '';
  try{ outletUrl = new URLSearchParams(location.search).get('o') || ''; }catch(e){}

  var cfg = null;

  db.collection('pengaturan').doc('survei').get().then(function(d){
    var s = (d && d.exists) ? (d.data() || {}) : {};
    // tiap field jatuh ke bawaan sendiri-sendiri, bukan sekaligus: pengaturan
    // yang baru diisi separuh tetap menghasilkan form yang utuh
    cfg = {
      aktif:      s.aktif !== false,
      tema:       s.tema || BAWAAN.tema,
      judul:      s.judul || BAWAAN.judul,
      sapaan:     s.sapaan || BAWAAN.sapaan,
      terimaKasih:s.terimaKasih || BAWAAN.terimaKasih,
      outlets:    (s.outlets && s.outlets.length) ? s.outlets : BAWAAN.outlets,
      pertanyaan: (s.pertanyaan && s.pertanyaan.length) ? s.pertanyaan : BAWAAN.pertanyaan
    };
    pasangTema(cfg.tema);
    if(!cfg.aktif){
      pesan('Form sedang ditutup', 'Terima kasih atas perhatiannya. Sampai jumpa lagi.');
      return;
    }
    var pertanyaan = cfg.pertanyaan.filter(function(q){ return q && q.teks; });
    if(!pertanyaan.length) pertanyaan = BAWAAN.pertanyaan;
    gambar(pertanyaan);
  }).catch(function(e){
    // Gagal membaca pengaturan bukan alasan menutup form: pakai bawaan,
    // supaya konsumen yang sudah berdiri di kasir tetap bisa menjawab.
    if(window.console) console.error(e);
    cfg = BAWAAN;
    gambar(BAWAAN.pertanyaan);
  });

  function gambar(pertanyaan){
    var outlets = (cfg.outlets || []).filter(function(o){ return o && o.nama && o.aktif !== false; });
    var outletCocok = outlets.some(function(o){ return o.nama === outletUrl; });
    var h = merekHtml();

    h += '<h1>' + esc(cfg.judul) + '</h1>';
    if(cfg.sapaan) h += '<p class="sapaan">' + esc(cfg.sapaan) + '</p>';

    // Store hanya ditanyakan kalau belum ditentukan lewat tautan
    if(!outletCocok && outlets.length){
      h += '<div class="soal"><label for="f_outlet">Kamu di store mana?<span class="wajib">*</span></label>' +
           '<select id="f_outlet"><option value="">— pilih store —</option>' +
           outlets.map(function(o){ return '<option value="' + esc(o.nama) + '">' + esc(o.nama) + '</option>'; }).join('') +
           '</select></div>';
    }

    pertanyaan.forEach(function(q, i){
      var wajib = q.wajib ? '<span class="wajib">*</span>' : '';
      h += '<div class="soal"><label for="q' + i + '">' + esc(q.teks) + wajib + '</label>';
      if(q.tipe === 'teks'){
        h += '<textarea id="q' + i + '" placeholder="Tulis di sini"></textarea>';
      } else {
        h += '<div class="opsi">';
        (q.opsi || []).forEach(function(o){
          h += '<label><input type="radio" name="q' + i + '" value="' + esc(o) + '" ' +
               'onchange="window.__cekLain(' + i + ')"><span>' + esc(o) + '</span></label>';
        });
        h += '</div><div class="lain" id="lain' + i + '" style="display:none">' +
             '<input type="text" id="qlain' + i + '" placeholder="Boleh tulis di sini"></div>';
      }
      h += '</div>';
    });

    h += '<button id="kirim">Kirim</button><div class="galat" id="galat" style="display:none"></div>';
    $('isi').innerHTML = h;
    $('kaki').textContent = 'Jawabanmu anonim. Kami tidak menyimpan nama, nomor, atau email.';
    $('kirim').addEventListener('click', function(){ kirim(pertanyaan, outletCocok ? outletUrl : null); });
  }

  // Pilihan yang berbunyi "Lainnya" memunculkan kotak isian bebas.
  window.__cekLain = function(i){
    var pilih = document.querySelector('input[name="q' + i + '"]:checked');
    var kotak = $('lain' + i);
    if(!kotak) return;
    var lain = pilih && /lain/i.test(pilih.value);
    kotak.style.display = lain ? 'block' : 'none';
    if(lain){ var el = $('qlain' + i); if(el) el.focus(); }
  };

  function kirim(pertanyaan, outletTetap){
    var btn = $('kirim'), gal = $('galat');
    gal.style.display = 'none';
    var gagal = function(m){ gal.textContent = m; gal.style.display = 'block'; btn.disabled = false; btn.textContent = 'Kirim'; };

    var outlet = outletTetap;
    if(!outlet){
      var sel = $('f_outlet');
      outlet = sel ? sel.value : '';
      if(sel && !outlet) return gagal('Pilih dulu store-nya.');
    }

    var jawaban = {};
    for(var i = 0; i < pertanyaan.length; i++){
      var q = pertanyaan[i], nilai = '';
      if(q.tipe === 'teks'){
        nilai = ($('q' + i).value || '').trim();
      } else {
        var pilih = document.querySelector('input[name="q' + i + '"]:checked');
        nilai = pilih ? pilih.value : '';
        if(nilai && /lain/i.test(nilai)){
          var bebas = ($('qlain' + i).value || '').trim();
          if(bebas) nilai = bebas;          // yang diketik lebih berguna daripada kata "Lainnya"
        }
      }
      if(q.wajib && !nilai) return gagal('Pertanyaan "' + q.teks + '" belum dijawab.');
      if(nilai) jawaban[q.teks] = nilai.slice(0, 500);
    }
    if(!Object.keys(jawaban).length) return gagal('Isi dulu minimal satu jawaban.');

    btn.disabled = true; btn.textContent = 'Mengirim…';
    db.collection('surveiJawaban').add({
      outlet: String(outlet || '').slice(0, 120),
      outletNama: String(outlet || '').slice(0, 120),
      jawaban: jawaban,
      at: new Date().toISOString()
    }).then(function(){
      $('isi').innerHTML = merekHtml() +
        '<div class="pusat"><div class="ceklis"><svg viewBox="0 0 24 24"><path d="m5 13 4.5 4.5L19 7"/></svg></div>' +
        '<h1>' + esc(cfg.terimaKasih) + '</h1>' +
        '<p class="sapaan" style="margin:0">Jawabanmu sudah kami terima.</p></div>';
      $('kaki').textContent = '';
    }).catch(function(e){
      if(window.console) console.error(e);
      gagal('Jawaban gagal terkirim. Periksa koneksi lalu coba lagi.');
    });
  }
})();
</script>
</body>
</html>
